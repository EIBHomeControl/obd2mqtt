; OBD2MQTT – BLE-OBD2 (ELM327) → MQTT/Home-Assistant Bridge
; Standard-Board: klassischer ESP32 (z.B. ESP32-DevKitC, WROOM-32)
; Andere Boards: `pio run -e esp32s3` bzw. `pio run -e esp32c3`

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/fw_name.py
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv   ; 2x ~1.9 MB App (OTA) + LittleFS
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.3.7\"

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
